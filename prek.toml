default_stages = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
    { id = "pytest", name = "Pytest", entry = "uv", args = ["run", "pytest", ".", "-q"], language = "system", files = '\.py$' },
    { id = "pyright", name = "Pyright", entry = "uv", args = ["run", "pyright"], language = "system", files = '\.py$' },
    { id = "ruff-lint", name = "Ruff Lint", entry = "uv", args = ["run", "ruff", "check", "--fix", "-q"], language = "system", files = '\.py$' },
    { id = "ruff-format", name = "Ruff Format", entry = "uv", args = ["run", "ruff", "format", "-q"], language = "system", files = '\.py$' },
]
